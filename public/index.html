<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Expense Tracker</h1>

    <section id="summary">
      <h2>Financial Summary</h2>

      <div class="summary-cards">
        <div class="card">
          <h3>Total Income</h3>
          <p id="total-income">0</p>
        </div>

        <div class="card">
          <h3>Total Expenses</h3>
          <p id="total-expenses">0</p>
        </div>

        <div class="card">
          <h3>Balance</h3>
          <p id="balance">0</p>
        </div>
      </div>
    </section>

    <section id="add-expense">
      <h2>Add New Transaction</h2>

      <form id="expense-form">
        <div>
          <label for="title">Title</label>
          <input type="text" id="title" required />
        </div>

        <div>
          <label for="amount">Amount</label>
          <input type="number" id="amount" min="0.01" step="any" required />
        </div>

        <div>
          <label for="category">Category</label>
          <input type="text" id="category" required />
        </div>

        <div>
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>

        <div>
          <label for="type">Type</label>
          <select id="type" required>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>

        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section id="transactions">
      <h2>Transactions</h2>
      <div class="filters">
        <label for="type-filter">Filter by Type:</label>

        <select id="type-filter">
          <option value="all">All Transactions</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <label for="category-filter">Filter by Category:</label>
        <select id="category-filter">
          <option value="all">All Categories</option>
        </select>

        <label for="start-date">From:</label>
        <input type="date" id="start-date" />
        <label for="end-date">To:</label>
        <input type="date" id="end-date" />

        <label for="sort-filter">Sort By:</label>
        <select id="sort-filter">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="highest">Highest Amount</option>
          <option value="lowest">Lowest Amount</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Type</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="expenses-list"></tbody>
      </table>
    </section>

    <div id="edit-modal" class="modal">
      <div class="modal-content">
        <h2>Edit Transaction</h2>

        <form id="edit-form">
          <div>
            <label for="edit-title">Title</label>
            <input type="text" id="edit-title" required />
          </div>

          <div>
            <label for="edit-amount">Amount</label>
            <input
              type="number"
              id="edit-amount"
              min="0.01"
              step="any"
              required
            />
          </div>

          <div>
            <label for="edit-category">Category</label>
            <input type="text" id="edit-category" required />
          </div>

          <div>
            <label for="edit-date">Date</label>
            <input type="date" id="edit-date" required />
          </div>

          <div>
            <label for="edit-type">Type</label>
            <select id="edit-type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="submit" class="save-btn">Save Changes</button>
            <button type="button" class="cancel-btn" onclick="closeEditModal()">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
